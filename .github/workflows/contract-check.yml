
name: Contract checks

on:
  push:
    paths:
      - 'contract/**'
      - '.github/workflows/contract-check.yml'
  pull_request:
    paths:
      - 'contract/**'
      - '.github/workflows/contract-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Check NEAR contract
        run: cargo check --manifest-path contract/Cargo.toml --target wasm32-unknown-unknown

      - name: Build release WebAssembly
        run: cargo build --manifest-path contract/Cargo.toml --target wasm32-unknown-unknown --release
